<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hiển thị Ngày, Tháng, Năm</title>
  </head>
  <body>
    <script language="JavaScript">
      var d = new Date();
      var ngay = d.getDate();
      var thang = d.getMonth() + 1;
      var nam = d.getFullYear();
      document.write("<h3>Hôm nay là: Ngày " + ngay + " tháng " + thang + " năm " + nam + "</h3>",);
    </script>
  </body>
</html>
